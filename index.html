<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pokémon Battle</title>
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>

    <div class="login-container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Usuário" required><br />
        <input type="password" id="password" placeholder="Senha" required>
        <button id="loginButton" type="button">Login</button>
        <button id="createAccountButton" type="button">Criar Conta</button>
        <div class="error" id="error-msg">Usuário ou senha inválidos</div>
    </div>

    <script src="assets/js/auth/login.js" defer></script>

</body>

</html>
